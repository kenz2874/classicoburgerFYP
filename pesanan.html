<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - CLASSICO BURGER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050b05;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(234, 179, 8, 0.12), transparent 50%),
                linear-gradient(rgba(5, 11, 5, 0.85), rgba(5, 11, 5, 0.95)), 
                url('burgerbg.jpeg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        .text-neon {
            text-shadow: 0 0 10px rgba(234, 179, 8, 0.5);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        /* printer fix (still on testing) */
        #singlePrintContainer {
            display: none;
        }

        /* mobile and desktop print area*/
        @media print {
            @page {
                margin: 0 !important;
                size: auto !important;
            }

            html, body {
                width: 100% !important;
                background-color: #ffffff !important;
                color: #000000 !important;
                margin: 0 !important;
                padding: 0 !important;
                font-family: 'Arial', sans-serif !important;
            }

            .main-app-container, .modal-overlay {
                display: none !important;
            }

            #singlePrintContainer {
                display: block !important;
                width: 100% !important;
                padding: 2mm 5mm !important;
                margin: 0 !important;
            }

            .receipt-store-header {
                text-align: center !important;
                margin-bottom: 8px !important;
                border-bottom: 2px dashed #000000 !important;
                padding-bottom: 6px !important;
            }

            .receipt-order-header {
                border-bottom: 1px dashed #000000 !important;
                padding-bottom: 4px !important;
                margin-bottom: 6px !important;
                display: flex !important;
                justify-content: space-between !important;
                font-size: 13px !important;
                font-weight: bold !important;
            }

            .receipt-customer-name {
                color: #000000 !important;
                font-weight: 900 !important;
                margin-bottom: 8px !important;
                text-transform: uppercase !important;
                font-size: 14px !important;
            }

            .receipt-item-block {
                margin-bottom: 6px !important;
            }

            .receipt-item-row {
                display: flex !important;
                justify-content: space-between !important;
                font-size: 14px !important;
                font-weight: bold !important;
                color: #000000 !important;
            }

            .receipt-item-note {
                font-size: 11px !important;
                font-weight: bold !important;
                color: #000000 !important;
                margin-top: 1px !important;
                padding-left: 8px !important;
            }

            .receipt-order-total {
                border-top: 2px dashed #000000 !important;
                padding-top: 6px !important;
                margin-top: 8px !important;
                display: flex !important;
                justify-content: space-between !important;
                font-weight: 900 !important;
                font-size: 16px !important;
                color: #000000 !important;
            }

            .receipt-footer {
                text-align: center !important;
                margin-top: 10px !important;
                padding-top: 6px !important;
                border-top: 1px dashed #000000 !important;
                font-size: 11px !important;
                font-weight: bold !important;
            }
        }
    </style>
</head>
<body class="text-white min-h-screen pb-20 selection:bg-yellow-500 selection:text-black">

    <div class="main-app-container max-w-2xl mx-auto px-4 py-8 space-y-6">

        <header class="text-center space-y-2 border-b border-stone-800/80 pb-6">
            <div class="text-2xl sm:text-3xl font-black text-yellow-400 tracking-wider italic text-neon flex items-center justify-center gap-2">
                🍔 CLASSICO BURGER
            </div>
            <h1 class="text-stone-300 font-extrabold text-sm uppercase tracking-widest">Order History & Receipts</h1>
        </header>

        <div class="bg-stone-900/80 border border-stone-800 p-4 rounded-2xl flex flex-col sm:flex-row gap-3 justify-between items-center shadow-lg">
            <div class="relative w-full sm:w-auto flex-1">
                <input type="text" id="orderSearchInput" oninput="renderOrderHistory()" placeholder="Search Order ID or Customer Name..." 
                    class="w-full bg-stone-950 border border-stone-700 focus:border-yellow-500 rounded-xl px-4 py-2.5 pl-9 text-xs text-stone-200 focus:outline-none transition">
                <span class="absolute left-3 top-2.5 text-stone-500 text-xs">🔍</span>
            </div>

            <div id="clear-container" style="display: none;">
                <button onclick="clearAllOrders()" class="w-full sm:w-auto px-4 py-2.5 bg-red-950/60 hover:bg-red-900 border border-red-800/60 text-red-400 font-bold rounded-xl text-xs transition flex items-center justify-center gap-1.5 whitespace-nowrap">
                    🗑️ Clear History
                </button>
            </div>
        </div>

        <div id="history-list" class="space-y-4"></div>

        <div class="space-y-2.5 pt-4">
            <a href="index.html" class="w-full py-3.5 bg-gradient-to-r from-yellow-500 to-amber-500 hover:from-yellow-400 hover:to-amber-400 text-stone-950 font-black rounded-2xl flex items-center justify-center gap-2 text-sm shadow-[0_0_20px_rgba(234,179,8,0.3)] transition transform active:scale-95 uppercase tracking-wide">
                ⬅️ Back to Menu
            </a>
            <a href="admin.html" class="w-full py-3.5 bg-stone-900 hover:bg-stone-800 border border-stone-800 text-stone-200 font-extrabold rounded-2xl flex items-center justify-center gap-2 text-sm transition uppercase tracking-wide">
                ⚙️ Admin Panel
            </a>
        </div>

    </div>

    <div id="singlePrintContainer"></div>

    <div id="editModal" class="modal-overlay">
        <div class="w-full max-w-md bg-stone-950 border border-yellow-500/40 rounded-3xl p-6 shadow-[0_0_50px_rgba(0,0,0,0.9)] max-h-[90vh] overflow-y-auto space-y-4">
            
            <div class="flex justify-between items-center border-b border-stone-800 pb-3">
                <h3 class="text-yellow-400 font-black text-base text-neon flex items-center gap-2">
                    ✏️ Edit Order <span id="modalOrderId" class="text-white"></span>
                </h3>
                <button onclick="closeEditModal()" class="w-7 h-7 rounded-full bg-stone-800 hover:bg-red-600 text-stone-300 flex items-center justify-center font-bold text-xs transition">
                    ✕
                </button>
            </div>

            <div>
                <label class="block text-xs font-bold text-stone-400 uppercase tracking-wider mb-1">Customer Name / Table No.</label>
                <input type="text" id="editCustomerName" class="w-full bg-stone-900 border border-stone-700 focus:border-yellow-500 rounded-xl px-3.5 py-2 text-xs text-yellow-400 font-bold focus:outline-none">
            </div>

            <div>
                <div class="text-xs font-bold text-yellow-400 uppercase tracking-wider mb-2">Current Order Items</div>
                <div id="editItemsContainer" class="space-y-2"></div>
            </div>

            <div class="bg-stone-900/60 border border-stone-800 p-3.5 rounded-2xl space-y-2">
                <div class="text-xs font-black text-yellow-400 uppercase tracking-wider">➕ Add Item / Burger</div>
                <div class="grid grid-cols-3 gap-2">
                    <select id="newItemSelect" class="col-span-2 bg-stone-950 border border-stone-700 text-white rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:border-yellow-500"></select>
                    <input type="number" id="newItemQty" value="1" min="1" class="bg-stone-950 border border-stone-700 text-white text-center rounded-xl px-2 py-1.5 text-xs focus:outline-none focus:border-yellow-500" placeholder="Qty">
                </div>
                <input type="text" id="newItemNote" placeholder="Note (e.g. No sauce, extra spicy)" class="w-full bg-stone-950 border border-stone-700 text-white rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:border-yellow-500">
                <button type="button" onclick="addItemToCurrentOrder()" class="w-full py-2 bg-yellow-500/20 hover:bg-yellow-500/30 border border-yellow-500/40 text-yellow-400 font-bold rounded-xl text-xs transition">
                    + Add To Order
                </button>
            </div>

            <div class="flex justify-between items-center font-black text-sm text-yellow-400 pt-2 border-t border-stone-800">
                <span>Updated Total:</span>
                <span id="editModalTotal" class="text-neon text-base">RM 0.00</span>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="saveOrderEdit()" class="flex-2 w-2/3 py-2.5 bg-gradient-to-r from-emerald-600 to-green-500 hover:from-emerald-500 hover:to-green-400 text-stone-950 font-black rounded-xl text-xs shadow-md transition transform active:scale-95 uppercase">
                    💾 Save Changes
                </button>
                <button onclick="closeEditModal()" class="flex-1 w-1/3 py-2.5 bg-stone-800 hover:bg-stone-700 text-stone-300 font-bold rounded-xl text-xs transition uppercase">
                    Cancel
                </button>
            </div>

        </div>
    </div>

    <script>
        let currentEditingOrderId = null;
        let editingOrderData = null;

        const defaultMenu = [
            { name: 'CLASSICO CHICKEN', price: 5.00 },
            { name: 'CLASSICO BEEF', price: 5.00 },
            { name: 'CLASSICO SPECIAL', price: 6.00 },
            { name: 'CLASSICO DOUBLE', price: 7.50 },
            { name: 'CLASSICO DOUBLE SPECIAL', price: 9.50 },
            { name: 'CLASSICO KING', price: 12.50 },
            { name: 'CLASSICO OBLONG', price: 6.00 },
            { name: 'CLASSICO KING OBLONG', price: 15.00 },
            { name: 'CLASSICO OBLONG LAMB', price: 10.00 },
            { name: 'CLASSICO KING OBLONG LAMB', price: 17.00 },
            { name: 'SET CHICKEN CRISPY BURGER + FRIES', price: 12.00 }
        ];

        document.addEventListener("DOMContentLoaded", function() {
            renderOrderHistory();
            populateMenuDropdown();
        });

        function populateMenuDropdown() {
            const menu = JSON.parse(localStorage.getItem('classicoMenuData')) || defaultMenu;
            const select = document.getElementById("newItemSelect");
            select.innerHTML = '';

            menu.forEach(item => {
                select.innerHTML += `<option value="${item.name}|${item.price}">${item.name} - RM ${parseFloat(item.price).toFixed(2)}</option>`;
            });
        }

        function renderOrderHistory() {
            const historyList = document.getElementById("history-list");
            const clearContainer = document.getElementById("clear-container");
            const searchQuery = document.getElementById("orderSearchInput") ? document.getElementById("orderSearchInput").value.trim().toLowerCase() : '';
            const orders = JSON.parse(localStorage.getItem("orderHistory")) || [];

            if (orders.length === 0) {
                clearContainer.style.display = "none";
                historyList.innerHTML = `
                    <div class="bg-stone-900/60 border border-stone-800 p-8 rounded-2xl text-center space-y-2">
                        <div class="text-4xl opacity-30">📋</div>
                        <p class="text-stone-400 font-semibold text-xs">No orders recorded for today.</p>
                    </div>
                `;
                return;
            }

            clearContainer.style.display = "block";
            historyList.innerHTML = '';
            
            const reversedOrders = [...orders].reverse();

            let matchedCount = 0;

            reversedOrders.forEach((order) => {
                const matchId = order.id.toLowerCase().includes(searchQuery);
                const matchCustomer = (order.customer || '').toLowerCase().includes(searchQuery);

                if (searchQuery && !matchId && !matchCustomer) return;

                matchedCount++;

                let itemsHtml = '';

                order.items.forEach(item => {
                    const noteHtml = item.note ? `<div class="text-[11px] text-yellow-400 font-semibold italic pl-2.5 mt-0.5">📝 Note: ${item.note}</div>` : '';

                    itemsHtml += `
                        <div class="py-1">
                            <div class="flex justify-between text-xs sm:text-sm font-semibold text-stone-200">
                                <span>${item.name} x${item.quantity}</span>
                                <span>RM ${(item.price * item.quantity).toFixed(2)}</span>
                            </div>
                            ${noteHtml}
                        </div>
                    `;
                });

                const orderCard = document.createElement("div");
                orderCard.className = "bg-stone-900/80 border border-stone-800 rounded-2xl p-4 sm:p-5 shadow-lg hover:border-yellow-500/40 transition space-y-3";
                orderCard.id = `order-${order.id}`;
                orderCard.innerHTML = `
                    <div class="flex justify-between items-center border-b border-stone-800/80 pb-2.5 text-xs">
                        <span class="font-extrabold text-yellow-400 text-sm">ID: #${order.id}</span>
                        <span class="text-stone-400 font-medium">${order.date}</span>
                    </div>

                    <div class="text-xs font-extrabold text-emerald-400 uppercase tracking-wide">
                        CUSTOMER: ${order.customer || 'Walk-in Customer'}
                    </div>

                    <div class="divide-y divide-stone-800/60 py-1">
                        ${itemsHtml}
                    </div>

                    <div class="flex justify-between items-center pt-2.5 border-t border-stone-800/80 font-black text-sm sm:text-base text-yellow-400">
                        <span>TOTAL:</span>
                        <span class="text-neon">RM ${parseFloat(order.total).toFixed(2)}</span>
                    </div>

                    <div class="flex gap-2 pt-1">
                        <button onclick="printSingleReceipt('${order.id}')" class="flex-2 w-1/2 py-2 bg-yellow-500/20 hover:bg-yellow-500/30 border border-yellow-500/40 text-yellow-400 font-bold rounded-xl text-xs transition">
                            🖨️ Print Receipt
                        </button>
                        <button onclick="openEditModal('${order.id}')" class="flex-1 w-1/4 py-2 bg-blue-950/60 hover:bg-blue-900 border border-blue-800/60 text-blue-400 font-bold rounded-xl text-xs transition">
                            ✏️ Edit
                        </button>
                        <button onclick="deleteSingleOrder('${order.id}')" class="flex-1 w-1/4 py-2 bg-red-950/60 hover:bg-red-900 border border-red-800/60 text-red-400 font-bold rounded-xl text-xs transition">
                            🗑️ Delete
                        </button>
                    </div>
                `;
                
                historyList.appendChild(orderCard);
            });

            if (searchQuery && matchedCount === 0) {
                historyList.innerHTML = `
                    <div class="bg-stone-900/60 border border-stone-800 p-8 rounded-2xl text-center">
                        <p class="text-stone-400 font-semibold text-xs">No matching orders found.</p>
                    </div>
                `;
            }
        }

        /* thermal receipt print */
        function printSingleReceipt(orderId) {
            const orders = JSON.parse(localStorage.getItem("orderHistory")) || [];
            const targetOrder = orders.find(o => o.id === orderId);

            if (!targetOrder) return;

            let itemsHtml = '';
            targetOrder.items.forEach(item => {
                const noteHtml = item.note ? `<div class="receipt-item-note">↳ Note: ${item.note}</div>` : '';
                itemsHtml += `
                    <div class="receipt-item-block">
                        <div class="receipt-item-row">
                            <span>${item.name} x${item.quantity}</span>
                            <span>RM ${(item.price * item.quantity).toFixed(2)}</span>
                        </div>
                        ${noteHtml}
                    </div>
                `;
            });

            const printContainer = document.getElementById("singlePrintContainer");
            printContainer.innerHTML = `
                <div class="receipt-store-header">
                    <h2 style="font-size: 13px; font-weight: 900; margin: 0; text-transform: uppercase; color:#000;">CLASSICO BURGER</h2>
                    <p style="font-size: 9px; margin: 1px 0; color:#000;">WA: 016-710 1046</p>
                    <p style="font-size: 9px; margin: 0; color:#000; font-weight:bold;">*** SALES RECEIPT ***</p>
                </div>

                <div class="receipt-order-header">
                    <span>ID: #${targetOrder.id}</span>
                    <span>${targetOrder.date}</span>
                </div>

                <div class="receipt-customer-name">CUSTOMER: ${targetOrder.customer || 'Walk-in Customer'}</div>

                <div>
                    ${itemsHtml}
                </div>

                <div class="receipt-order-total">
                    <span>TOTAL:</span>
                    <span>RM ${parseFloat(targetOrder.total).toFixed(2)}</span>
                </div>

                <div class="receipt-footer">
                    <p>Thank You & Please Come Again!</p>
                    <p style="margin-top:2px;">--- CLASSICO POS ---</p>
                </div>
            `;

            window.print();
        }

        /* edit for modal function */
        function openEditModal(orderId) {
            const orders = JSON.parse(localStorage.getItem("orderHistory")) || [];
            const targetOrder = orders.find(o => o.id === orderId);

            if (!targetOrder) return;

            currentEditingOrderId = orderId;
            editingOrderData = JSON.parse(JSON.stringify(targetOrder));

            document.getElementById("modalOrderId").textContent = `#${orderId}`;
            document.getElementById("editCustomerName").value = editingOrderData.customer || '';

            renderEditItemsList();

            document.getElementById("editModal").style.display = "flex";
        }

        function renderEditItemsList() {
            const container = document.getElementById("editItemsContainer");
            container.innerHTML = '';

            let grandTotal = 0;

            editingOrderData.items.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                grandTotal += itemTotal;

                container.innerHTML += `
                    <div class="bg-stone-900 border border-stone-800 p-2.5 rounded-xl space-y-1.5">
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-bold text-stone-200">${item.name} (RM ${item.price.toFixed(2)})</span>
                            <div class="flex items-center gap-1.5">
                                <button type="button" class="w-6 h-6 bg-stone-800 hover:bg-yellow-500 hover:text-stone-950 text-white rounded font-bold text-xs" onclick="changeItemQty(${index}, -1)">-</button>
                                <span class="text-xs font-bold text-yellow-400 w-5 text-center">${item.quantity}</span>
                                <button type="button" class="w-6 h-6 bg-stone-800 hover:bg-yellow-500 hover:text-stone-950 text-white rounded font-bold text-xs" onclick="changeItemQty(${index}, 1)">+</button>
                            </div>
                        </div>
                        <input type="text" value="${item.note || ''}" placeholder="Note (e.g. No sauce)..." 
                            onchange="updateItemNote(${index}, this.value)" 
                            class="w-full bg-stone-950 border border-stone-700 text-stone-300 rounded-lg px-2.5 py-1 text-[11px] focus:outline-none focus:border-yellow-500">
                    </div>
                `;
            });

            editingOrderData.total = grandTotal;
            document.getElementById("editModalTotal").textContent = `RM ${grandTotal.toFixed(2)}`;
        }

        function changeItemQty(index, change) {
            editingOrderData.items[index].quantity += change;

            if (editingOrderData.items[index].quantity <= 0) {
                editingOrderData.items.splice(index, 1);
            }

            renderEditItemsList();
        }

        function updateItemNote(index, newNote) {
            editingOrderData.items[index].note = newNote.trim();
        }

        function addItemToCurrentOrder() {
            const select = document.getElementById("newItemSelect");
            const qtyInput = document.getElementById("newItemQty");
            const noteInput = document.getElementById("newItemNote");

            if (!select.value) return;

            const [name, price] = select.value.split('|');
            const qty = parseInt(qtyInput.value, 10) || 1;
            const note = noteInput.value.trim();

            editingOrderData.items.push({
                name: name,
                price: parseFloat(price),
                quantity: qty,
                note: note
            });

            qtyInput.value = 1;
            noteInput.value = '';

            renderEditItemsList();
        }

        function saveOrderEdit() {
            if (editingOrderData.items.length === 0) {
                alert("Order must have at least 1 item!");
                return;
            }

            editingOrderData.customer = document.getElementById("editCustomerName").value.trim() || 'Walk-in Customer';

            let orders = JSON.parse(localStorage.getItem("orderHistory")) || [];
            const orderIndex = orders.findIndex(o => o.id === currentEditingOrderId);

            if (orderIndex !== -1) {
                orders[orderIndex] = editingOrderData;
                localStorage.setItem("orderHistory", JSON.stringify(orders));
                renderOrderHistory();
                closeEditModal();
            }
        }

        function closeEditModal() {
            document.getElementById("editModal").style.display = "none";
            currentEditingOrderId = null;
            editingOrderData = null;
        }

        function deleteSingleOrder(orderId) {
            if (confirm(`Are you sure you want to delete order ID #${orderId}?`)) {
                let orders = JSON.parse(localStorage.getItem("orderHistory")) || [];
                orders = orders.filter(order => order.id !== orderId);
                localStorage.setItem("orderHistory", JSON.stringify(orders));
                renderOrderHistory();
            }
        }

        function clearAllOrders() {
            if (confirm("Are you sure you want to delete ALL order history?")) {
                localStorage.removeItem("orderHistory");
                renderOrderHistory();
            }
        }
    </script>
</body>
</html>
